name: Portfolio demo
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04 # pinned: Playwright can't install browsers on ubuntu-26.04 yet
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exception-dashboard/package-lock.json
      - run: npm ci
        working-directory: exception-dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: exception-dashboard
      - run: npm run test:e2e
        working-directory: exception-dashboard
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: exception-dashboard/playwright-report/
          retention-days: 7
      - run: node --test .github/scripts/deploy-pages.test.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: pages-artifact
        with:
          path: exception-dashboard/demo-dist
      - name: Deploy the exact uploaded Pages artifact
        id: deployment
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: node .github/scripts/deploy-pages.mjs
