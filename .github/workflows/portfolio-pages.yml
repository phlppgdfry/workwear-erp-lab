name: Portfolio demo
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exception-dashboard/package-lock.json
      - run: npm ci
        working-directory: exception-dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: exception-dashboard
      - run: npm run test:e2e
        working-directory: exception-dashboard
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: exception-dashboard/playwright-report/
          retention-days: 7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: exception-dashboard/demo-dist
      - name: Wait for the uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact did not become visible within 60 seconds."
          exit 1
      - uses: actions/deploy-pages@v5
        id: deployment
